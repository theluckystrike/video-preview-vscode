[package]
name = "vp-audio"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "alac", "mp3", "pcm", "adpcm", "isomp4", "mkv"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
